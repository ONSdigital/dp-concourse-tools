components:
  - name: golang
    arg: GOLANG_VERSION
    version: "1.26.8"
    version_tag: "patch"
  - name: vulncheck
    arg: DIS_VULNCHECK_VERSION
    version: "0.6.1"
    version_tag: "patch"
  - name: node
    arg: NODEJS_VERSION
    version: "24.19.0"
    version_tag: "major"
format: "{golang}-vulncheck-{vulncheck}-node-{node}"
requiresIsLatest: true
