components:
  - name: golang
    arg: GOLANG_VERSION
    version: "1.26.8"
    version_tag: "patch"
    distro_suffix: "bookworm"
  - name: golangci-lint
    arg: GOLANGCILINT_VERSION
    version: "2.12.2"
    version_tag: "major"
format: "{golang}-golangci-lint-{golangci-lint}"
requiresIsLatest: true
