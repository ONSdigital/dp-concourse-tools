components:
  - name: golang
    arg: GOLANG_VERSION
    version: "1.27.4"
    version_tag: "patch"
  - name: python
    arg: PYTHON_VERSION
    version: "3.15"
    version_tag: "patch"
  - name: golangci-lint
    arg: GOLANGCILINT_VERSION
    version: "2.15.0"
    version_tag: "patch"
  - name: ruff
    arg: RUFF_VERSION
    version: "0.17.4"
    version_tag: "patch"
format: "{golang}-python-{python}-golangci-lint-{golangci-lint}-ruff-{ruff}"
requiresIsLatest: true
