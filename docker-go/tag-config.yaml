components:
  - name: golang
    arg: GOLANG_VERSION
    version: "1.26.8"
    has_distro_suffix: false
  - name: docker
    arg: DOCKER_VERSION
    version: "28.5.2"
    versioning:
      enum:
        - "major"
        - "minor"
        - "patch"
format: "{golang}-dind-{docker}"
requiresIsLatest: true
