components:
  - name: golang
    arg: GOLANG_VERSION
    version: "1.27.2"
    has_distro_suffix: false
  - name: docker
    arg: DOCKER_VERSION
    version: "28.5.2"
    versioning:
      enum:
        - "major"
        - "minor"
        - "patch"
  - name: python
    arg: PYTHON_VERSION
    version: "3.15"
format: "{golang}-python-{python}-dind-{docker}"
requiresIsLatest: true
